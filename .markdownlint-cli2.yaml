# markdownlint-cli2 config.  See https://github.com/DavidAnson/markdownlint
# for the full rule list.  Tuned to match the README/CONTRIBUTING style
# already in the repo so existing files don't all need rewrites.

config:
  # Line length: don't enforce -- the README has long URLs + cell rows
  # that would be uglier broken than left over the limit.
  MD013: false
  # Allow inline HTML for the centered logo + collapsible sections.
  MD033: false
  # Allow duplicate headings (multiple "Install" subsections, etc.).
  MD024: false
  # Don't require a top-level h1 -- README uses centered HTML title.
  MD041: false
  # Allow bare URLs (rare but readable).
  MD034: false
  # Files don't need a single h1.
  MD025: false
  # Don't enforce a table column style.  Padding these tables into
  # aligned columns is unreadable in the source when one cell runs to
  # several hundred characters, and the agenda parity fixture under
  # tests/fixtures/ is compared byte for byte, so it cannot be restyled
  # at all.
  MD060: false

# No `globs` key: the caller decides what to lint.  `make lint-md` passes
# the tracked markdown, and CI passes its own globs to the action.  A
# `globs` here would be unioned with those, dragging in the ignored
# notes and vendored grammars a local tree happens to hold.

ignores:
  - "node_modules/**"
  - "tests/deps/**"
  - "org-mode/**"
  - "org-roam/**"
  - "tree-sitter-org*/**"
  - ".superpowers/**"
  - ".git/**"
