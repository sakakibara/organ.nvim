name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [stable, nightly]
    steps:
      - uses: actions/checkout@v5

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sqlite3 libsqlite3-0 libnotify-bin at libcairo2 librsvg2-bin

      - name: setup node (for tree-sitter generate)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: run test suite
        run: make test

  autolink-oracle:
    # Differential check of the GFM extended-autolink importer against the
    # reference renderer (cmark-gfm, what GitHub uses).  The committed
    # spec.json fixtures only cover a few autolink cases; this builds a pinned
    # cmark-gfm and diffs a large deterministic corpus against it.  Runs once
    # (the parser is pure Lua, independent of the nvim version).
    name: extended-autolink differential (vs cmark-gfm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: build cmark-gfm (pinned)
        run: |
          set -eux
          git clone --depth 1 --branch 0.29.0.gfm.13 \
            https://github.com/github/cmark-gfm /tmp/cmark-gfm
          cmake -S /tmp/cmark-gfm -B /tmp/cmark-gfm/build -DCMARK_TESTS=OFF
          cmake --build /tmp/cmark-gfm/build -j
          bin=/tmp/cmark-gfm/build/src/cmark-gfm
          test -x "$bin"
          printf 'www.example.com\n' | "$bin" -e autolink   # smoke test
          echo "ORGAN_CMARK_GFM=$bin" >> "$GITHUB_ENV"

      - name: extended-autolink differential
        run: |
          set -eo pipefail
          out=$(nvim --headless -l tests/extended_autolink_oracle_test.lua </dev/null 2>&1)
          echo "$out"
          # Fail if the test skipped (binary not found) rather than passing.
          echo "$out" | grep -q "extended_autolink_oracle_test: PASS"

  emphasis-oracle:
    # Differential check of the emphasis/strikethrough importer against
    # cmark-gfm over a large deterministic corpus of unbalanced delimiter soup.
    # The spec.json fixtures cover only well-formed emphasis; the rule-of-3,
    # openers_bottom barrier, and GFM strikethrough length-equality rules were
    # developed against this differential.  Runs once (pure Lua, nvim-version
    # independent).
    name: emphasis/strikethrough differential (vs cmark-gfm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: build cmark-gfm (pinned)
        run: |
          set -eux
          git clone --depth 1 --branch 0.29.0.gfm.13 \
            https://github.com/github/cmark-gfm /tmp/cmark-gfm
          cmake -S /tmp/cmark-gfm -B /tmp/cmark-gfm/build -DCMARK_TESTS=OFF
          cmake --build /tmp/cmark-gfm/build -j
          bin=/tmp/cmark-gfm/build/src/cmark-gfm
          test -x "$bin"
          printf '*a* ~~b~~\n' | "$bin" -e strikethrough   # smoke test
          echo "ORGAN_CMARK_GFM=$bin" >> "$GITHUB_ENV"

      - name: emphasis/strikethrough differential
        run: |
          set -eo pipefail
          out=$(nvim --headless -l tests/from_md_emphasis_oracle_test.lua </dev/null 2>&1)
          echo "$out"
          # Fail if the test skipped (binary not found) rather than passing.
          echo "$out" | grep -q "from_md_emphasis_oracle_test: PASS"

  parity:
    # Compares organ against Emacs: the parser diff and every conformance
    # gate (tests/conformance/).  Runs once (no nvim-version matrix) since
    # the emacs install is heavy and the organ side already ranges across
    # versions in the matrixed `test` job above.
    name: emacs conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sqlite3 libsqlite3-0 libnotify-bin

      # Pinned, not the distribution's emacs: the sweep compares our
      # extractor against whatever org that build ships, and they do not
      # agree with each other.  29.3 (org 9.6) strips COMMENT as a bare
      # prefix, so it reads `COMMENTARY` as a commented `ARY`; 9.7 requires
      # the whole word.  A gate against a moving oracle tests the oracle.
      - name: install emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5
        with:
          version: '31.1'

      - name: setup node (for tree-sitter generate)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: parser vs org-element diff sweep
        # The matrixed `test` job installs no emacs, so this test skips
        # there; this job is the only place it actually runs.  Fail on a
        # SKIP too -- a parity gate that did not run is not a pass.
        run: |
          set -o pipefail
          make deps grammar
          emacs --version | head -1
          # Capture without -e so the diff is printed when it fails; the
          # grep below is what decides the outcome.
          out=$(nvim --headless -l tests/parser_emacs_diff_test.lua </dev/null 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "^parser emacs diff ok"

      - name: fetch org-roam and its dependencies (pinned)
        # The capture gate's roam cases compare against org-roam; pinned
        # so the oracle cannot move under the gate.
        run: |
          set -eux
          fetch() {
            git init -q "/tmp/roam/$1"
            git -C "/tmp/roam/$1" fetch -q --depth 1 "$2" "$3"
            git -C "/tmp/roam/$1" checkout -q FETCH_HEAD
          }
          fetch compat https://github.com/emacs-compat/compat 9a234d0d28cccd33f64faea6074fa2865a17c164
          fetch dash https://github.com/magnars/dash.el 1de9dcb83eacfb162b6d9a118a4770b1281bcd84
          fetch emacsql https://github.com/magit/emacsql fb05d0f72729a4b4452a3b1168a9b7b35a851a53
          fetch magit https://github.com/magit/magit 93e86ceca7bf5b0ff9023d7f138e5f06990fc276
          fetch org-roam https://github.com/org-roam/org-roam 9fd7c87b5b9037ec0d450c58ca7f69e8d25eeb24

      - name: conformance gates
        env:
          CONFORMANCE_ORG_ROAM_PATH: /tmp/roam/compat:/tmp/roam/dash:/tmp/roam/emacsql:/tmp/roam/magit/lisp:/tmp/roam/org-roam:/tmp/roam/org-roam/extensions
        run: make conformance

  smoke-lazy:
    name: smoke (lazy.nvim install + load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sqlite3 libsqlite3-0 libnotify-bin

      - name: setup node (for tree-sitter generate)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: lazy.nvim install + load + open .org
        run: |
          mkdir -p ~/.config/nvim
          cat > ~/.config/nvim/init.lua <<EOF
          local lazypath = vim.fn.stdpath("data") .. "/lazy/lazy.nvim"
          if not (vim.uv or vim.loop).fs_stat(lazypath) then
            vim.fn.system({
              "git", "clone", "--filter=blob:none",
              "https://github.com/folke/lazy.nvim.git", "--branch=stable", lazypath,
            })
          end
          vim.opt.rtp:prepend(lazypath)

          require("lazy").setup({
            {
              dir = "$GITHUB_WORKSPACE",
              dependencies = {
                "sakakibara/tablature.nvim",
                "sakakibara/narrow.nvim",
              },
              build = function() require("organ.grammar_install").install() end,
              config = function()
                require("organ").setup({ org_dir = "/tmp/org" })
              end,
            },
          }, { install = { missing = true } })
          EOF

          mkdir -p /tmp/org
          cat > /tmp/org/smoke.org <<EOF
          * TODO smoke test
          SCHEDULED: <2099-01-01 Fri 09:00>
          ** subtask
          - [ ] checkbox item
          EOF

          # Trigger lazy install + sync, then quit.
          timeout 90 nvim --headless -c 'Lazy! sync' -c 'qa' 2>&1 || true

          # Now actually open the org file and run a couple of commands.
          # Capture all output; fail if any real Vim/Lua error appears.
          # `:Org status` legitimately prints `errors=N` as a health field, so
          # we match concrete error markers instead of the bare word "error".
          output=$(timeout 30 nvim --headless /tmp/org/smoke.org \
            -c 'Org status' \
            -c 'messages' \
            -c 'qa' 2>&1)
          echo "$output"
          if echo "$output" | grep -qE 'Error detected|E[0-9]+:|stack traceback'; then
            echo ""
            echo "FAIL: errors detected during smoke test"
            exit 1
          fi
          echo ""
          echo "PASS: lazy.nvim install + load + open .org succeeded"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ tests/
      # luaVersion is pinned because v13 defaults to 5.5, and which Lua
      # luacheck runs under is a linting decision, not something to inherit
      # from an action bump.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck
      - run: luacheck lua/ plugin/

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
            !tests/deps

  # Demo GIFs in assets/demos/ are CI-only artifacts: the demos
  # workflow renders them from assets/tapes/*.tape and force-adds
  # them in a [skip ci] commit.  Local `make demos` is preview-only
  # — devs must NOT commit rendered files (they'd race CI's render
  # of the same tape and produce drift between the README image
  # and the source-of-truth tape).
  #
  # This guard rejects any push or PR that adds / modifies
  # assets/demos/* unless it's the demos workflow's own bot commit.
  demos-source-of-truth:
    name: assets/demos is CI-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need history so we can diff against the merge base.
          fetch-depth: 0
      - name: verify no human commits touched assets/demos/
        run: |
          # On PRs: compare against the PR base.  On push: compare
          # against the previous commit on this branch.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to diff against — skipping guard"
            exit 0
          fi
          # `--diff-filter=AM` covers adds + modifications -- the cases
          # where a human-rendered GIF would drift from the CI render.
          # Deletions are always allowed (cleanup of stale artifacts is
          # safe; nothing depends on a stale .log persisting).
          changed=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- assets/demos/)
          if [ -z "$changed" ]; then
            echo "PASS: no human commit added or modified assets/demos/"
            exit 0
          fi
          # Bot commits use the github-actions[bot] author; allow them.
          for sha in $(git log --diff-filter=AM --format=%H "$base"...HEAD -- assets/demos/); do
            author=$(git log -1 --format=%ae "$sha")
            if [ "$author" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              echo "FAIL: $sha added/modified assets/demos/ but author is $author"
              echo ""
              echo "Demo GIFs are CI-only artifacts.  Edit the tape in"
              echo "assets/tapes/ and let the demos workflow regenerate"
              echo "the GIF on push.  Local \`make demos\` is preview-"
              echo "only — never commit the rendered files."
              exit 1
            fi
          done
          echo "PASS: assets/demos/ changes are all from the bot"
